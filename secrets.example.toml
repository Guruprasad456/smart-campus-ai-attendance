# Copy these settings into Streamlit Community Cloud → App settings → Secrets,
# or save them locally as .streamlit/secrets.toml. Never commit real credentials.

PRINCIPAL_PASSWORD = "replace-with-a-strong-password"

# WhatsApp via Twilio. Use your approved WhatsApp sender in E.164 format.
# The Principal panel may safely override only this sender number locally;
# the Account SID and Auth Token must always remain protected in this file.
# A plain message works in the Twilio Sandbox or an active WhatsApp conversation.
# For production alerts outside the 24-hour service window, set an approved
# TWILIO_CONTENT_SID template that accepts variables 1-5: name, roll number,
# date, time slot, and class.
TWILIO_ACCOUNT_SID = "replace-with-your-twilisid"
TWILIO_AUTH_TOKEN = "replace-with-your-twilio-auth-token"
TWILIO_WHATSAPP_FROM = "whatsapp:+14155238886"
TWILIO_CONTENT_SID = ""

# Optional SMS text message through Twilio. Use an SMS-capable Twilio number in E.164 format.
TWILIO_SMS_FROM = "replace-with-your-sms-capable-twilio-number"

# Parent email via SMTP. Gmail requires an App Password, not your normal password.
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "587"
SMTP_USERNAME = "college@example.com"
SMTP_PASSWORD = "replace-with-your-email-app-password"
SMTP_FROM_EMAIL = "college@example.com"
SMTP_USE_SSL = "false"
