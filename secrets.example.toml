# Copy these settings into Streamlit Community Cloud → App settings → Secrets,
# or save them locally as .streamlit/secrets.toml. Never commit real credentials.

PRINCIPAL_PASSWORD = "replace-with-a-strong-password"

# Choose one: "fast2sms" or "android"
SMS_PROVIDER = "fast2sms"

# Fast2SMS credentials. Use route "q" only if it is enabled on your account;
# otherwise use "dlt" and provide your approved sender/template IDs.
FAST2SMS_API_KEY = "replace-with-your-fast2sms-key"
FAST2SMS_ROUTE = "q"
FAST2SMS_SENDER_ID = ""
FAST2SMS_TEMPLATE_PRESENT = ""
FAST2SMS_TEMPLATE_ABSENT = ""

# Alternative Android SMS gateway configuration.
GATEWAY_URL = ""
GATEWAY_TOKEN = ""
